spring:
  profiles:
    active: local
    include: secret
  application:
    name: diveon
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Requires the manual ops migration and coordinated worker/Lambda rollout.
grading:
  recovery:
    enabled: false
    max-attempts: 3
    grace-seconds: 900
    poll-ms: 15000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: always
