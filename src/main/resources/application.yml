spring:
  profiles:
    active: local
    include: secret
  application:
    name: diveon
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Turn on only after the grading recovery SQL and the grading Lambda are in place.
grading:
  recovery:
    enabled: false
    max-attempts: 3
    grace-seconds: 900
    poll-ms: 15000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: always

# Turn on only after the practice build SQL, buildspec, EventBridge rules and IAM are in place.
practice:
  build:
    enabled: false
    recovery-enabled: false
    deadline-minutes: 10
    poll-ms: 30000
    batch-size: 50
    discovery-pages: 10
    project: syslab-practice-build
