<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Login Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17212b;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        main {
            width: min(760px, calc(100% - 32px));
            background: #ffffff;
            border: 1px solid #d9e0e7;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 12px 28px rgba(19, 32, 45, 0.08);
        }

        h1 {
            margin: 0 0 16px;
            font-size: 24px;
            line-height: 1.25;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            height: 42px;
            border: 1px solid #b9c4cf;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
        }

        button {
            height: 42px;
            margin-top: 18px;
            border: 0;
            border-radius: 6px;
            padding: 0 16px;
            background: #1a73e8;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        pre {
            min-height: 160px;
            max-height: 360px;
            overflow: auto;
            margin: 18px 0 0;
            border: 1px solid #d9e0e7;
            border-radius: 6px;
            background: #101820;
            color: #d6f5e3;
            padding: 14px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
<main>
    <h1>Google Login Test</h1>

    <label for="clientId">Google OAuth Client ID</label>
    <input id="clientId" placeholder="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">

    <label for="backendEndpoint">Backend Endpoint</label>
    <input id="backendEndpoint" value="http://localhost:8080/api/local/auth/google/login">

    <label for="scope">Scope</label>
    <input id="scope" value="openid email profile">

    <button id="loginButton" type="button">Google Authorization Code 요청</button>

    <pre id="result">대기 중...</pre>
</main>

<script>
    const loginButton = document.getElementById("loginButton");
    const result = document.getElementById("result");

    function print(value) {
        if (typeof value === "string") {
            result.textContent = value;
            return;
        }
        result.textContent = JSON.stringify(value, null, 2);
    }

    function getConfig() {
        return {
            clientId: document.getElementById("clientId").value.trim(),
            backendEndpoint: document.getElementById("backendEndpoint").value.trim(),
            scope: document.getElementById("scope").value.trim()
        };
    }

    async function sendCodeToBackend(code, backendEndpoint) {
        const response = await fetch(backendEndpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ code })
        });

        const responseText = await response.text();
        let body;
        try {
            body = responseText ? JSON.parse(responseText) : null;
        } catch (error) {
            body = responseText;
        }

        if (!response.ok) {
            throw {
                status: response.status,
                body
            };
        }

        return body;
    }

    loginButton.addEventListener("click", () => {
        const { clientId, backendEndpoint, scope } = getConfig();

        if (!clientId) {
            print("Google OAuth Client ID를 입력하십시오.");
            return;
        }

        if (!backendEndpoint) {
            print("백엔드 엔드포인트를 입력하십시오.");
            return;
        }

        if (!window.google || !google.accounts || !google.accounts.oauth2) {
            print("Google Identity Services SDK가 아직 로드되지 않았습니다. 잠시 후 다시 시도하십시오.");
            return;
        }

        loginButton.disabled = true;
        print("구글 인증 창을 여는 중...");

        const codeClient = google.accounts.oauth2.initCodeClient({
            client_id: clientId,
            scope,
            ux_mode: "popup",
            callback: async (response) => {
                try {
                    if (response.error) {
                        throw response;
                    }

                    print({
                        step: "authorization_code_received",
                        code: response.code
                    });

                    const backendResponse = await sendCodeToBackend(response.code, backendEndpoint);
                    print({
                        step: "backend_login_success",
                        response: backendResponse
                    });
                } catch (error) {
                    print({
                        step: "failed",
                        error
                    });
                } finally {
                    loginButton.disabled = false;
                }
            },
            error_callback: (error) => {
                print({
                    step: "google_popup_failed",
                    error
                });
                loginButton.disabled = false;
            }
        });

        codeClient.requestCode();
    });
</script>
</body>
</html>
