name: Backend verification and release artifact
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: corretto
      - name: Test and build without deployment secrets
        run: bash gradlew test bootJar verifyRelease --no-daemon
      - name: Prepare exact source revision and checksums
        run: |
          mkdir -p release
          cp build/libs/diveon-backend.jar release/
          cp -R ops release/
          cp Dockerfile release/
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          (cd release && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ github.sha }}
          path: build/test-results/test/
